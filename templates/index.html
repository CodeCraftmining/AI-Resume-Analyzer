<!DOCTYPE html>
<html>
<head>

    <title>AI Resume Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{

            margin:0;
            padding:0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #2563eb
            );

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            color:white;
        }

        .main-box{

            width:60%;

            background: rgba(255,255,255,0.1);

            backdrop-filter: blur(12px);

            border:1px solid rgba(255,255,255,0.2);

            border-radius:25px;

            padding:40px;

            box-shadow:0 8px 32px rgba(0,0,0,0.3);

        }

        h1{

            text-align:center;

            font-size:48px;

            font-weight:bold;

            margin-bottom:15px;
        }

        .subtitle{

            text-align:center;

            font-size:18px;

            color:#dbeafe;

            margin-bottom:40px;
        }

        label{

            font-size:20px;

            margin-bottom:10px;

            font-weight:bold;
        }

        .form-control{

            background: rgba(255,255,255,0.15);

            border:none;

            color:white;

            padding:15px;

            border-radius:12px;

            font-size:17px;
        }

        .form-control::placeholder{

            color:#d1d5db;
        }

        .form-control:focus{

            box-shadow:none;

            border:2px solid #38bdf8;

            background: rgba(255,255,255,0.2);

            color:white;
        }

        textarea{

            resize:none;
        }

        .btn-custom{

            width:100%;

            padding:15px;

            font-size:20px;

            font-weight:bold;

            border:none;

            border-radius:12px;

            background: linear-gradient(
                90deg,
                #00c6ff,
                #0072ff
            );

            color:white;

            transition:0.3s;
        }

        .btn-custom:hover{

            transform:scale(1.02);

            color:white;
        }

        .upload-box{

            border:2px dashed rgba(255,255,255,0.4);

            padding:25px;

            border-radius:15px;

            text-align:center;

            margin-bottom:25px;
        }

    </style>

</head>

<body>

    <div class="main-box">

        <h1>AI Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and compare it with job descriptions using AI
        </p>

        <form method="POST" enctype="multipart/form-data">

            <div class="upload-box">

                <label class="mb-3">
                    Upload Resume (PDF)
                </label>

                <input
                    type="file"
                    name="resume"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-4">

                <label>
                    Paste Job Description
                </label>

                <textarea
                    name="job_description"
                    class="form-control"
                    rows="10"
                    placeholder="Paste Data Science / Software Developer Job Description here..."
                    required
                ></textarea>

            </div>

            <button type="submit" class="btn btn-custom">
                Analyze Resume
            </button>

        </form>

    </div>

</body>
</html>
